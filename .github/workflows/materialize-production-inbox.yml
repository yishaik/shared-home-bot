name: Materialize production inbox

on:
  push:
    branches: [agent/production-smart-inbox]
    paths:
      - '.inbox-build/**'
      - '.github/workflows/materialize-production-inbox.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore production inbox source
        shell: bash
        run: |
          set -euo pipefail
          cat .inbox-build/chunk_* | base64 --decode > /tmp/production-inbox.tar.gz
          tar -xzf /tmp/production-inbox.tar.gz
          rm -rf .inbox-build .github/workflows/materialize-production-inbox.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Replace MVP inbox with production action workflow'
          git push origin "HEAD:${GITHUB_REF_NAME}"
