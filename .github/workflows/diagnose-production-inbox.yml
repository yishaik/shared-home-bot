name: Diagnose production inbox

on:
  push:
    branches: [agent/production-smart-inbox]
    paths:
      - '.github/workflows/diagnose-production-inbox.yml'

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture pytest output
        shell: bash
        run: |
          set -euo pipefail
          pip install -r requirements-dev.txt >/tmp/pip.log 2>&1
          set +e
          python -m pytest -q > /tmp/pytest-output.txt 2>&1
          code=$?
          set -e
          mkdir -p .ci-diagnostic
          cp /tmp/pytest-output.txt .ci-diagnostic/pytest-output.txt
          printf '%s\n' "$code" > .ci-diagnostic/exit-code.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ci-diagnostic
          git commit -m 'Capture production inbox test failure'
          git push origin "HEAD:${GITHUB_REF_NAME}"
